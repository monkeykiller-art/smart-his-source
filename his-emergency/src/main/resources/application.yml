server:
  port: 8089
spring:
  application:
    name: his-emergency
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/his?currentSchema=his_emergency
    username: ${DB_USER:his}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    schemas: his_emergency
    default-schema: his_emergency
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
