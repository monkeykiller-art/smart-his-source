server:
  port: 8080

spring:
  application:
    name: his-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${HIS_CORS_ALLOWED_ORIGINS:http://localhost:*,https://localhost:*}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: his-auth-health
          uri: lb://his-auth
          order: -1
          predicates:
            - Path=/api/auth/health
          filters:
            - SetPath=/health
        - id: his-patient-health
          uri: lb://his-patient
          order: -1
          predicates:
            - Path=/api/patient/health
          filters:
            - SetPath=/health
        - id: his-clinical-health
          uri: lb://his-clinical
          order: -1
          predicates:
            - Path=/api/clinical/health
          filters:
            - SetPath=/health
        - id: his-operations-health
          uri: lb://his-operations
          order: -1
          predicates:
            - Path=/api/operations/health
          filters:
            - SetPath=/health
        - id: his-pharma-health
          uri: lb://his-pharma
          order: -1
          predicates:
            - Path=/api/pharma/health
          filters:
            - SetPath=/api/pharma/health
        - id: his-emergency-health
          uri: lb://his-emergency
          order: -1
          predicates:
            - Path=/api/emergency/health
          filters:
            - SetPath=/health
        - id: his-auth
          uri: lb://his-auth
          predicates:
            - Path=/api/auth/**
        - id: his-patient
          uri: lb://his-patient
          predicates:
            - Path=/api/patient/**
        - id: his-clinical
          uri: lb://his-clinical
          predicates:
            - Path=/api/clinical/**
        - id: his-operations
          uri: lb://his-operations
          predicates:
            - Path=/api/operations/**
        - id: his-pharma
          uri: lb://his-pharma
          predicates:
            - Path=/api/pharma/**
        - id: his-emergency
          uri: lb://his-emergency
          predicates:
            - Path=/api/emergency/**

his:
  jwt:
    secret: ${HIS_JWT_SECRET}
  security:
    whitelist:
      - /
      - /index.html
      - /assets/**
      - /api/auth/login
      - /api/auth/captcha
      - /api/*/health
      - /actuator/**
      - /*/v3/api-docs/**
      - /swagger-ui/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: his-gateway

logging:
  level:
    root: INFO
    com.smarthis: INFO
    org.springframework.cloud.gateway: INFO
