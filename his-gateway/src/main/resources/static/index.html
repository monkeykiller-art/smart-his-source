<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart HIS 智慧医院工作台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>H</span><div>Smart HIS<small>智慧医院信息系统</small></div></div>
    <nav id="navigation"></nav>
    <div class="sidebar-foot"><span class="pulse"></span> 服务状态实时检测</div>
  </aside>

  <main>
    <header>
      <div><p class="eyebrow">HOSPITAL COMMAND CENTER</p><h1>医院运营总览</h1></div>
      <div class="header-actions"><span id="clock"></span><button id="refresh">刷新状态</button></div>
    </header>

    <section class="hero">
      <div><span class="tag">统一门户</span><h2>让诊疗信息在正确的时间，抵达正确的人</h2>
        <p>覆盖患者服务、临床诊疗、资源保障、运营管理和区域协同，关键决策保留人工确认。</p></div>
      <div class="hero-metric"><strong id="healthyCount">--</strong><span>在线服务</span><small>共 11 项核心服务</small></div>
    </section>

    <section class="metrics">
      <article><span>今日门诊</span><strong>--</strong><small>接入业务数据后显示</small></article>
      <article><span>当前住院</span><strong>--</strong><small>床位与入院服务</small></article>
      <article><span>待审核处方</span><strong>--</strong><small>药师人工确认</small></article>
      <article><span>危急值待处理</span><strong>--</strong><small>闭环追踪</small></article>
    </section>

    <section class="section-head"><div><p class="eyebrow">DOMAIN WORKBENCH</p><h2>业务域工作台</h2></div><span>按建设方案五大域组织</span></section>
    <section class="domains" id="domains"></section>

    <section class="service-panel">
      <div class="section-head"><div><p class="eyebrow">SERVICE HEALTH</p><h2>微服务运行状态</h2></div><span id="lastChecked">等待检测</span></div>
      <div class="services" id="services"></div>
    </section>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
