<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart HIS 智慧医院工作台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>H</span><div>Smart HIS<small>智慧医院信息系统</small></div></div>
    <nav id="navigation"></nav>
    <div class="sidebar-foot"><span class="pulse"></span> 服务状态实时检测</div>
  </aside>

  <main>
    <header>
      <div><p class="eyebrow">OUTPATIENT WORKBENCH</p><h1>基础门诊工作台</h1></div>
      <div class="header-actions"><span id="clock"></span><button id="refresh">刷新状态</button></div>
    </header>

    <section class="hero">
      <div><span class="tag">门诊基础版</span><h2>完成患者从建档到收费的基础门诊流程</h2>
        <p>当前版本覆盖患者建档、门诊挂号、临床接诊和门诊收费。</p></div>
      <div class="hero-metric"><strong id="healthyCount">--</strong><span>在线服务</span><small>共 4 项业务服务</small></div>
    </section>

    <section class="metrics">
      <article><span>今日门诊</span><strong>--</strong><small>接入业务数据后显示</small></article>
      <article><span>今日挂号</span><strong>--</strong><small>接入业务数据后显示</small></article>
      <article><span>当前接诊</span><strong>--</strong><small>接入业务数据后显示</small></article>
      <article><span>待缴账单</span><strong>--</strong><small>接入业务数据后显示</small></article>
    </section>

    <section class="section-head"><div><p class="eyebrow">OUTPATIENT WORKFLOW</p><h2>基础门诊流程</h2></div><span>只保留当前交付范围</span></section>
    <section class="domains" id="domains"></section>

    <section class="service-panel">
      <div class="section-head"><div><p class="eyebrow">SERVICE HEALTH</p><h2>微服务运行状态</h2></div><span id="lastChecked">等待检测</span></div>
      <div class="services" id="services"></div>
    </section>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
