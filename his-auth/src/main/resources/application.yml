server:
  port: 8081

spring:
  application:
    name: his-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/his?currentSchema=his_auth
    username: ${DB_USER:his}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: his_auth
    default-schema: his_auth
    baseline-on-migrate: true
    table: flyway_schema_history
his:
  datasource:
    db-type: POSTGRE_SQL
  jwt:
    secret: ${HIS_JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
  security:
    max-failed-attempts: 5
    lock-minutes: 15

mybatis-plus:
  mapper-locations: classpath*:mapper/xml/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: his-auth
