spring:
  application:
    name: his-cdss
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        file-extension: yaml
        shared-configs:
          - data-id: his-shared.yaml
            refresh: true
