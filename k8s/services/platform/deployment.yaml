apiVersion: apps/v1
kind: Deployment
metadata:
  name: his-platform
  namespace: his-app
  labels:
    app: his-platform
    app.kubernetes.io/name: his-platform
    app.kubernetes.io/part-of: smart-his
spec:
  replicas: 1
  selector:
    matchLabels:
      app: his-platform
  template:
    metadata:
      labels:
        app: his-platform
        app.kubernetes.io/name: his-platform
        app.kubernetes.io/part-of: smart-his
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: his-platform
          image: smart-his/his-platform:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: his-app-config
            - secretRef:
                name: his-app-secret
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70.0 -Djava.security.egd=file:/dev/./urandom"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
              cpu: "750m"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            periodSeconds: 20
            failureThreshold: 5
