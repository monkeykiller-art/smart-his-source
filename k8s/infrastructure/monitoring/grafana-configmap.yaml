apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: his-infra
  labels:
    app: grafana
    app.kubernetes.io/part-of: smart-his
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
