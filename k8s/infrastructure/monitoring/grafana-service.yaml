apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: his-infra
  labels:
    app: grafana
    app.kubernetes.io/part-of: smart-his
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
