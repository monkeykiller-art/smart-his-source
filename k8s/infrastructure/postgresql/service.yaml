apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: his-infra
  labels:
    app: postgresql
    app.kubernetes.io/part-of: smart-his
spec:
  type: ClusterIP
  selector:
    app: postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
