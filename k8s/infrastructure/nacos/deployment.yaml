apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: his-infra
  labels:
    app: nacos
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: smart-his
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: "standalone"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: his-infra-secret
                  key: NACOS_AUTH_TOKEN
            - name: NACOS_AUTH_IDENTITY_KEY
              valueFrom:
                secretKeyRef:
                  name: his-infra-secret
                  key: NACOS_AUTH_IDENTITY_KEY
            - name: NACOS_AUTH_IDENTITY_VALUE
              valueFrom:
                secretKeyRef:
                  name: his-infra-secret
                  key: NACOS_AUTH_IDENTITY_VALUE
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "512m"
          ports:
            - name: http
              containerPort: 8848
              protocol: TCP
            - name: grpc-client
              containerPort: 9848
              protocol: TCP
            - name: grpc-server
              containerPort: 9849
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /nacos/v1/console/health/liveness
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 5
