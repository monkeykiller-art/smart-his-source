apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: his-infra
  labels:
    app: nacos
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: smart-his
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30848
      protocol: TCP
    - name: grpc-client
      port: 9848
      targetPort: 9848
      protocol: TCP
    - name: grpc-server
      port: 9849
      targetPort: 9849
      protocol: TCP
